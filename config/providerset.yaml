anchor-provider:
  pf: &pf { type: file, health-check: { enable: true, url: https://www.gstatic.com/generate_204, interval: 300, expected-status: 204 } }
  ph: &ph { type: http, interval: 43200, proxy: DIRECT, exclude-filter: '(?i)https?://|官网|官方(?:网站|频道|公告)|用户群|电报群|交流群|防失联|漏洞|账户|过期时间|到期日期|到期时间|剩余流量|已用流量|流量已用|重置|套餐|订阅|expire|traffic', health-check: { enable: true, url: https://www.gstatic.com/generate_204, interval: 300, expected-status: 204 } }

proxy-providers:
  provider1:
    <<: *ph
    url: https://example.com/subscription.yaml
    path: ./proxy_providers/provider1.yaml
    # 节点命名：[供应商] 入口 → 出口线路 [倍率,标签…]
    # 供应商缩写以大写字母开头，可带数字、下划线和连字符；入口和尾部标签按需省略。
    # 出口以标准地区名开头：香港、台湾、新加坡、日本、美国。
    # 仅在原名不符合约定时，按该订阅的实际命名设置 override，不启用通用改名规则。
    # 可选：只对名称确实包含倍率标签的机场启用，否则会排除全部未标注节点。
    # 仅保留名称标注倍率不大于1的节点
    # 不使用单词边界，兼容倍率数值紧贴中文的节点名称
    # filter: '.*倍率[:：]?\s*(?:0(?:\.\d+)?|1(?:\.0+)?)(?![\d.]).*'
    # 本地 provider 示例
    # provider2:
    #   <<: *pf
    #   path: ./proxy_providers/provider2.yaml
